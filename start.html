<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipSeek で作る</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@500&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#FBFAF7; --surface:#fff; --blue:#0069BA; --blue-dk:#004C87; --mist:#E7F0F8;
         --ink:#14171A; --slate:#5B636B; --hair:#E5E2DA;
         --disp:'Bricolage Grotesque','Noto Sans JP',sans-serif; --jp:'Noto Sans JP',sans-serif; --mono:'JetBrains Mono',monospace; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{ background:var(--paper); color:var(--ink); font-family:var(--jp); line-height:1.7; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100% }
  .page{ max-width:560px; margin:0 auto; padding:0 20px 80px }
  .topbar{ display:flex; align-items:center; gap:9px; padding:18px 2px 0 }
  .topbar img{ width:24px; height:auto; display:block }
  .topbar .wm{ font-family:var(--disp); font-weight:800; letter-spacing:-.02em; font-size:17px }
  .topbar a{ margin-left:auto; font-family:var(--jp); font-size:12.5px; color:var(--slate); text-decoration:none }
  .hero{ padding:44px 0 0 }
  .kicker{ font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--blue-dk); background:var(--mist); border-radius:999px; padding:6px 12px; display:inline-block }
  h1{ font-family:var(--disp); font-weight:800; letter-spacing:-.03em; font-size:33px; line-height:1.2; margin:16px 0 0 }
  .lead{ font-size:14.5px; color:var(--slate); margin:12px 0 0; line-height:1.75 }
  form{ margin-top:26px }
  .field{ position:relative; display:flex; align-items:center }
  .field svg{ position:absolute; left:16px; width:19px; height:19px; stroke:var(--slate); pointer-events:none }
  #url{ width:100%; font-family:var(--jp); font-size:16px; color:var(--ink); background:var(--surface);
        border:1.5px solid var(--hair); border-radius:14px; padding:16px 16px 16px 44px; outline:none;
        box-shadow:0 2px 10px rgba(0,40,80,.04); transition:.15s }
  #url::placeholder{ color:#9aa0a6 }
  #url:focus{ border-color:var(--blue); box-shadow:0 4px 18px rgba(0,105,186,.1) }
  #url.bad{ border-color:#D9482F }
  .go{ width:100%; margin-top:12px; appearance:none; border:0; cursor:pointer;
       font-family:var(--disp); font-weight:800; font-size:17px; color:#fff; background:var(--blue);
       border-radius:999px; padding:17px; box-shadow:0 6px 0 var(--blue-dk); transition:.1s }
  .go:active{ transform:translateY(3px); box-shadow:0 3px 0 var(--blue-dk) }
  .hint{ font-family:var(--mono); font-size:11px; color:var(--slate); margin-top:12px; line-height:1.7 }
  .hint b{ color:var(--ink); font-weight:600 }
  .err{ font-size:12.5px; color:#D9482F; margin-top:10px; min-height:1px }
  .note{ margin-top:30px; border-top:1px solid var(--hair); padding-top:22px; display:flex; flex-direction:column; gap:12px }
  .row{ display:flex; gap:11px; align-items:flex-start; font-size:13.5px; color:var(--ink); line-height:1.6 }
  .dot{ width:9px; height:9px; border-radius:99px; background:var(--blue); margin-top:7px; flex:none }
  .row.soon .dot{ background:#B8C2CC }
  .row.soon{ color:var(--slate) }
  .foot{ margin-top:34px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; color:var(--slate) }
  .foot a{ color:var(--blue-dk); text-decoration:none }
</style>

  <div class="hero">
    <span class="kicker">YouTube チャンネル内検索</span>
    <h1>チャンネルの<br>検索ページを作る</h1>
    <p class="lead">YouTubeチャンネルのURLを貼るだけ。無料で、その場でできます。<br>ログインは要りません。</p>

    <form id="f">
      <div class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="YouTubeチャンネルのURL / @ハンドル">
      </div>
      <button class="go" type="submit">作る →</button>
      <div class="err" id="err"></div>
      <div class="hint">例: <b>https://www.youtube.com/@handle</b> ／ <b>@handle</b> ／ チャンネルURL</div>
    </form>

    <div class="note">
      <div class="row"><span class="dot"></span><div>動画のタイトルと概要欄から、まとめて検索できます</div></div>
      <div class="row"><span class="dot"></span><div>見つけた動画をそのまま開けます</div></div>
      <div class="row soon"><span class="dot"></span><div>字幕（秒数へジャンプ）は、アカウント連携で使えます</div></div>
    </div>

    <div class="foot">Powered by <a href="make.html">ClipSeek</a></div>
  </div>
</div>

  var f=document.getElementById('f'), url=document.getElementById('url'), err=document.getElementById('err');
  function looksYouTube(s){
    s=s.trim();
    if(!s) return false;
    if(/youtube\.com\//i.test(s)) return true;
    if(/^@[0-9A-Za-z._\-]{2,}$/.test(s)) return true;
    if(/^UC[0-9A-Za-z_\-]{20,}$/.test(s)) return true;
    if(/^[0-9A-Za-z._\-]{2,}$/.test(s)) return true; // bare handle without @
    return false;
  }
  f.addEventListener('submit', function(e){
    e.preventDefault();
    var v=(url.value||'').trim();
    if(!looksYouTube(v)){
      url.classList.add('bad'); err.textContent='YouTubeチャンネルのURL、または @ハンドル を入れてください。'; url.focus(); return;

    err.textContent=''; url.classList.remove('bad');
    location.href='app.html?c='+encodeURIComponent(v);

  url.addEventListener('input', function(){ url.classList.remove('bad'); err.textContent=''; });
